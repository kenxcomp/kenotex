# Time Patterns Configuration / 时间模式配置
# This file configures how @time expressions are recognized and parsed.
# 此文件配置 @time 表达式的识别和解析方式。
#
# Location / 位置: ~/.config/kenotex/time_patterns.toml
# Auto-created on first run with these defaults.
# 首次运行时自动创建，使用以下默认值。

# Time period defaults — keyword → "HH:MM"
# 时间段默认值 — 关键词 → "HH:MM"
[periods]
早上 = "09:00"
上午 = "09:00"
中午 = "12:00"
下午 = "14:00"
晚上 = "19:00"
morning = "09:00"
afternoon = "14:00"
evening = "19:00"

# Date offset keywords — keyword → day offset from today
# 日期偏移关键词 — 关键词 → 距今天天数
[offsets]
今天 = 0
明天 = 1
后天 = 2
大后天 = 3
下周 = 7
today = 0
tomorrow = 1

# Weekday aliases — alias → standard English weekday name
# 星期别名 — 别名 → 标准英文星期名
[weekdays]
周一 = "monday"
周二 = "tuesday"
周三 = "wednesday"
周四 = "thursday"
周五 = "friday"
周六 = "saturday"
周日 = "sunday"
星期一 = "monday"
星期二 = "tuesday"
星期三 = "wednesday"
星期四 = "thursday"
星期五 = "friday"
星期六 = "saturday"
星期日 = "sunday"

# Hour keywords — Chinese numeral → hour number (0-23)
# 小时关键词 — 中文数字 → 小时数 (0-23)
[hours]
一 = 1
二 = 2
三 = 3
四 = 4
五 = 5
六 = 6
七 = 7
八 = 8
九 = 9
十 = 10
十一 = 11
十二 = 12

# Minute keywords — Chinese numeral → minute number (0-59)
# 分钟关键词 — 中文数字 → 分钟数 (0-59)
[minutes]
五 = 5
十 = 10
十五 = 15
二十 = 20
二十五 = 25
三十 = 30
三十五 = 35
四十 = 40
四十五 = 45
五十 = 50
五十五 = 55
